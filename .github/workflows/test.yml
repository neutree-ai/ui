name: Test

on:
  pull_request:
    branches: [main, 'dev-*']

  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint & format check
        run: yarn lint:ci

      - name: Type check
        run: yarn typecheck

      - name: Check layer boundaries
        run: yarn dep-check

      - name: Check unused exports & dependencies
        run: yarn knip

      - name: Check i18n translations
        run: node tools/i18n-tracker.cjs

      - name: Check i18n key references
        run: node tools/check-i18n-keys.cjs

      - name: Check Tailwind shadow utilities
        run: node tools/check-shadow-utilities.cjs

      - name: Check unit-test patterns
        run: node tools/check-test-patterns.cjs

      - name: Check chart colours
        run: node tools/check-chart-colors.cjs

      - name: Check data contracts were updated
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node tools/check-contract-touch.cjs "origin/$GITHUB_BASE_REF"

      - name: Check DDU layer overrides
        run: node tools/ddu-layers.cjs check

      - name: Measure DDU layer change
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          out="$RUNNER_TEMP/ddu-metrics"
          mkdir -p "$out"
          base_sha=$(git merge-base "origin/$BASE_REF" HEAD)
          git worktree add --detach "$RUNNER_TEMP/ddu-base" "$base_sha"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/ddu-base/node_modules"
          node tools/ddu-layers.cjs --root "$RUNNER_TEMP/ddu-base" --json "$out/base.json" > /dev/null
          node tools/ddu-layers.cjs --json "$out/head.json" > /dev/null
          flags=()
          if ! git diff --quiet "$base_sha" HEAD -- tools/ddu-layers.cjs; then
            flags+=(--rules-changed)
          fi
          node tools/ddu-metrics-diff.cjs "$out/base.json" "$out/head.json" "${flags[@]}" --out "$out/comment.md"
          cat "$out/comment.md" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$PR_NUMBER" > "$out/pr-number"
          rm "$out/base.json" "$out/head.json"

      - name: Upload DDU layer change
        if: github.event_name == 'pull_request' && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ddu-metrics
          path: ${{ runner.temp }}/ddu-metrics
          if-no-files-found: ignore
          retention-days: 7

      - name: Run tests
        run: yarn test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Report-only: renders the screens that change against the merge base from
  # mock data and publishes a before/after page. It never fails the pull request.
  visual-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the base and whether the UI changed
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base_sha=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$base_sha" HEAD -- src index.html e2e/visual playwright.visual.config.ts tools/visual-diff tools/visual-diff.cjs package.json yarn.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.scope.outputs.changed == 'true'
        run: yarn install --frozen-lockfile

      - name: Install browser
        if: steps.scope.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Render and compare screens
        id: diff
        if: steps.scope.outputs.changed == 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: |
          node tools/visual-diff.cjs --base "$BASE_SHA" --out "$RUNNER_TEMP/visual-diff"
          mkdir -p "$RUNNER_TEMP/visual-html"
          cp "$RUNNER_TEMP/visual-diff/report.html" "$RUNNER_TEMP/visual-html/visual-diff.html"

      - name: Upload report page
        id: report
        if: steps.diff.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/visual-html/visual-diff.html
          archive: false
          retention-days: 7

      - name: Prepare comment
        if: steps.diff.outcome == 'success'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_ID: ${{ steps.report.outputs.artifact-id }}
        run: |
          out="$RUNNER_TEMP/visual-diff-comment"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/visual-diff/comment.md" "$out/comment.md"
          printf '%s' "$PR_NUMBER" > "$out/pr-number"
          printf '%s' "$ARTIFACT_ID" > "$out/artifact-id"

      - name: Upload comment
        if: steps.diff.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-comment
          path: ${{ runner.temp }}/visual-diff-comment
          retention-days: 7
